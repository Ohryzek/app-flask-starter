<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Hello world</title>
</head>
<body>
    Ahoj, dnes je {{ date }}.
    <hr>
    
    <!-- Tady zobrazíme srozumitelnou chybovou zprávu z Pythonu -->
    {% if error %}
        <p style="color: red;"><strong>{{ error }}</strong></p>
    {% endif %}

    {% if name %}
        <strong>{{ name }} {{ surname }}, rád tě vidím!</strong><hr>
    {% endif %}

    Řekni mi své jméno a já tě pozdravím!
    <form method="POST">
        <input type="text" name="name" placeholder="Zadej své jméno">
        <input type="text" name="surname" placeholder="Zadej své příjmení">
        <input type="password" name="password" placeholder="Zadej heslo (pro tajnou informaci)">
        <button type="submit">Pozdrav mě!</button>
    </form>

    <!-- Tajná informace -->
    {% if secret %}
        <hr>
        <p style="color: green;"><strong>🎉 Tajná informace:</strong> {{ secret }}</p>
    {% endif %}

</body>
</html>
